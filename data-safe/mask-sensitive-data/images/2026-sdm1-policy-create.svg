<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" role="img" aria-labelledby="title desc">
<title id="title">Create the Mask_SDM1 masking policy</title>
<desc id="desc">Reference form showing the Mask_SDM1 name, SDM1 sensitive data model, and CUSTOMER, PAYMENT, and SUPPORT description.</desc>
<rect width="1300" height="760" fill="#f7f8fa"/>
<text x="32" y="56" fill="#111827" font-family="Arial,sans-serif" font-size="32" font-weight="700">Create masking policy</text>
<rect x="32" y="84" width="1236" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="52" y="114" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Name</text><text x="52" y="143" fill="#111827" font-family="Arial,sans-serif" font-size="19" font-weight="700">Mask_SDM1</text>
<rect x="32" y="182" width="1236" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="52" y="212" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Description</text><text x="52" y="241" fill="#111827" font-family="Arial,sans-serif" font-size="19">Masking policy for CUSTOMER, PAYMENT, and SUPPORT schemas discovered by SDM1</text>
<text x="32" y="310" fill="#111827" font-family="Arial,sans-serif" font-size="22" font-weight="700">Choose how you want to create the masking policy</text>
<rect x="32" y="334" width="590" height="116" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="3"/><text x="58" y="374" fill="#075985" font-family="Arial,sans-serif" font-size="20" font-weight="700">Using a sensitive data model</text><text x="58" y="408" fill="#0c4a6e" font-family="Arial,sans-serif" font-size="16">Automatically pull all columns from SDM1</text>
<rect x="650" y="334" width="618" height="116" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/><text x="676" y="374" fill="#374151" font-family="Arial,sans-serif" font-size="20" font-weight="700">Using a target database</text><text x="676" y="408" fill="#4b5563" font-family="Arial,sans-serif" font-size="16">Create an empty masking policy</text>
<rect x="32" y="482" width="590" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="52" y="512" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Sensitive data model compartment</text><text x="52" y="541" fill="#111827" font-family="Arial,sans-serif" font-size="19" font-weight="700">Workshop compartment</text>
<rect x="650" y="482" width="618" height="76" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/><text x="670" y="512" fill="#64748b" font-family="Arial,sans-serif" font-size="15">Sensitive data model</text><text x="670" y="541" fill="#111827" font-family="Arial,sans-serif" font-size="19" font-weight="700">SDM1</text>
<rect x="32" y="610" width="1236" height="70" rx="8" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/><text x="58" y="640" fill="#92400e" font-family="Arial,sans-serif" font-size="17" font-weight="700">Wait for the policy to become Active before reviewing its generated columns.</text><text x="58" y="665" fill="#92400e" font-family="Arial,sans-serif" font-size="16">Do not start a masking job in this lab.</text>
<text x="32" y="730" fill="#6b7280" font-family="Arial,sans-serif" font-size="16">Reference visual for this lab; tenancy-specific compartment names are intentionally generic.</text>
</svg>
