<text x="600" y="193" text-anchor="middle" fill="#fff" font-family="Arial,sans-serif" font-size="25" font-weight="700">Mask_SDM1</text>
<text x="600" y="218" text-anchor="middle" fill="#e6ffed" font-family="Arial,sans-serif" font-size="16">Review formats and pre-check</text>
