<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
<title id="title">SDM1 masking scope</title>
<desc id="desc">SDM1 connects three schemas and four tables to the Mask_SDM1 policy.</desc>
