<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="880" viewBox="0 0 1700 880" role="img" aria-labelledby="title desc">
<title id="title">Mask_SDM1 masking columns and generated formats</title>
<desc id="desc">All thirteen sensitive columns in the CUSTOMER, PAYMENT, and SUPPORT schemas with their generated masking formats.</desc>
