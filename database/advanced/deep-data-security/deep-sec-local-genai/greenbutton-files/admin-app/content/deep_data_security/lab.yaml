steps:
  - id: prepare_applab
    badge: "1"
    label: Prepare App
    title: Prepare App
    action_ids:
      - prepare_applab
    next_hint: Run Create database role to set up ordinary Oracle login plumbing before Deep Sec begins.
    notes:
      - "Let us get started by creating the lab schema, modifying the database's network ACL to allow access to Object Storage, creating the CUSTOMERS table and loading sample data. All very routine stuff!"

  - id: create_db_roles
    badge: "2"
    label: Create DB Role
    title: Create DB Role
    action_ids:
      - create_db_roles
    next_hint: Continue to Create data roles. This is where Deep Sec starts.
    notes:
      - "Right now you are just creating basic Oracle Database roles and grants you are probably already familiar with."
      - "One important thing to note: traditional system privileges cannot be granted directly to Deep Sec data roles. That is why you create this traditional database role, HOL_DBROLE_CONNECT, first."

  - id: review_setup
    badge: "3"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_db_setup
    next_hint: Continue to Deep Sec Setup to create the data roles and grants Marvin will use.
    quiz:
      question: Why did you grant CREATE SESSION to the HOL_DBROLE_CONNECT database role?
      options:
        - key: data_role
          label: Data roles can hold system privileges only after their first data grant.
        - key: database_role
          label: Data roles cannot receive system privileges directly, so the standard database role supplies the login privilege through the data role.
        - key: local_user
          label: Only local database users need CREATE SESSION; IAM users never need it.
        - key: admin
          label: CREATE SESSION must be granted directly to each end user by ADMIN.
      correct_answer: database_role
      explanation: Correct. HOL_DBROLE_CONNECT is the standard database-role bridge for CREATE SESSION; the data role carries that database role to the end user.
    notes:
      - "Each section ends with a SQL script showing what you have accomplished, plus a quiz. You are not being graded, the answers are in my earlier notes. Guess as many times as you want, or skip it by pressing Next Step."

  - id: create_roles
    badge: "1"
    label: Create data roles
    title: Create data roles
    action_ids:
      - create_roles
    next_hint: Run Create data grants to give these data roles something to actually authorize.
    notes:
      - "Data roles are the first new Deep Sec concept you will learn. They are similar to traditional roles, you grant privileges to a data role and grant the data role to users, but with Deep Sec, you grant data grants to data roles, and data roles to end users. You will learn more about this in the next step."
      - "In your environment this role would be named for the job, such as SALES_EMPLOYEE or CLAIMS_ADJUSTER. The HOL_ prefix is only a lab convention."
      - "For now, just know this: you can grant data grants directly to end users, but to help you scale, it is better to grant them to standard database roles instead. In this example, you grant the traditional database role to the EMPLOYEE_ACCESS data role."
      - "Data Roles can also be enterprise-identified, meaning they can be mapped to your OCI IAM or Azure Entra ID roles. This allows you to assign membership at the directory level and have it granted within the Oracle AI Database."
      - "CREATE OR REPLACE is supported for data roles. Standard database roles do not support the REPLACE option, that is a Deep Sec-specific convenience."

  - id: create_data_grants
    badge: "2"
    label: Create data grants
    title: Create data grants
    action_ids:
      - create_data_grants
    next_hint: Run Create end users to create Marvin and Emma. The employee data grant starts wide open and can be narrowed later.
    notes:
      - "This is where you start to see the power of Deep Sec. You are granting SELECT on a specific table, CUSTOMERS, to the data role you just created. This one is basic, you will build on it soon."
      - "The data grant authorizes the data role to SELECT from the table. Whoever holds that data role can issue a SELECT. Data grants also support optional clauses, you will learn about those in the Customize Grant section."

  - id: create_users
    badge: "3"
    label: Create end users
    title: Create end users
    action_ids:
      - create_end_users
    next_hint: The data roles and grants are defined before any people receive them. Continue to Grant Data Role for Marvin's starting state.
    notes:
      - "This is the third new Deep Sec concept, end users. They are like traditional database users, with one key difference, they are schemaless. They do not own any objects in the database, which matches how most real users behave anyway, most people only access data, they never create tables or views."
      - "Think of end users as similar to application users, they did not used to exist in the database, only in the application. Deep Sec brings that concept into the database itself, so you can secure them directly with data roles and data grants."
      - "If you are in an enterprise IAM environment, you will not use local end users the way this lab does. You will authenticate with your enterprise identity instead, for example, dee.bee@oracle.com. Deep Sec reads your token, knows who you are and what roles you hold in the directory, and your data roles and data grants take care of the rest."
      - "That means you would never manage users directly again, that responsibility moves to your IAM or IDP team. You map directory groups to Deep Sec data roles, and data grants handle the security."

  - id: grant_employee_access
    badge: "4"
    label: Grant Data Role
    title: Grant Data Role
    action_ids:
      - grant_employee_access
    next_hint: Open Customer Sales App to see this access from Marvin's side.
    notes:
      - "Remember the earlier note on local versus enterprise end users? Because Marvin and Emma are local end users, you have to manually assign them the data roles you want them to have."
      - "If you were integrated with a directory instead, you would write something like CREATE DATA ROLE HOL_DATAROLE_EMPLOYEE_ACCESS MAPPED TO 'azure_role=EMPLOYEES', and the mapping would take care of itself automatically the next time Marvin or Emma logs in."

  - id: review
    badge: "5"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_light
    next_hint: Continue to Customer Sales App to see this access from Marvin's side.
    quiz:
      question: "You've created a data role and a data grant. Why can't Marvin query APPLAB.CUSTOMERS yet?"
      options:
        - key: not_granted
          label: "The data role hasn't been granted to Marvin yet, so he holds no access, no matter what the grant authorizes."
        - key: copy_needed
          label: "APPLAB.CUSTOMERS must first be copied into Marvin's own schema."
        - key: app_permission
          label: "The Customer Sales App hasn't been told to allow Marvin in."
        - key: context_needed
          label: "Marvin has the SELECT ANY TABLE system privilege."
      correct_answer: not_granted
      explanation: "Correct. A data role and its grant only define what access is possible. Nothing is actually authorized until an end user holds that data role."
    notes:
      - "Now let us see what you built. You should see two data roles, one data grant, a predicate that is wide open (1=1), the roles granted to your end users and data roles, and the two new end users, Emma and Marvin."

  - id: customer_sales
    badge: "1"
    label: Customer Sales App
    title: Customer Sales App
    action_ids:
      - customer_sales
    next_hint: Continue to Customize Data Grant to narrow the rows and columns Oracle returns to Marvin.
    quiz:
      question: "The data grant you just created has no WHERE clause at all. What does that mean for which rows Marvin can see?"
      options:
        - key: every_row
          label: "Every row is authorized, a data grant with no predicate means no row restriction at all."
        - key: no_rows
          label: "No rows are authorized until a predicate is added."
        - key: filled_columns
          label: "Only rows where every column is filled in are authorized."
        - key: own_row_default
          label: "Oracle defaults to showing just Marvin's own row."
      correct_answer: every_row
      explanation: "Correct. A data grant's WHERE clause is optional. Leaving it out is Deep Sec's own way of saying every row, not something you fake with 1=1."
    notes:
      - "This is where you get to see what you built. Open the Customer Sales App, sign in with the same password you used for this app, and run Customer Report. Then check your understanding with the quiz."

  - id: customize_employee_grant
    badge: "1"
    label: Customize Data Grant
    title: Customize Data Grant
    action_ids:
      - customize_employee_grant
    next_hint: Continue to Check Customer Sales App to confirm the change took effect.
    notes:
      - "Now you are getting into the really good stuff. In this section, you will modify the basic data grant you created, choosing which columns to exclude from SELECT or include for UPDATE. This is the real power of Deep Sec, control down to the column level."
      - "You will also restrict which rows come back, limited to the specific sales rep running the query. Nothing is hardcoded for Marvin or Emma specifically, you are matching their identity, ora_end_user_context.username, directly against the row data."
      - "Notice DELETE does not get its own column here the way SELECT and UPDATE do. Oracle scopes DELETE at the row level only, it cannot be restricted to specific columns, so it is a single toggle instead of a per-column choice."
      - "For this data grant, exclude the credit_limit and sensitive_identifier columns, and restrict rows to only the sales rep's own. As you toggle columns, row restriction, and delete permission, watch the Generated SQL window update to match your choices."

  - id: verify_employee_grant
    badge: "2"
    label: Check Customer Sales App
    title: Check Customer Sales App
    action_ids:
      - verify_employee_grant
    next_hint: Continue to Review to confirm the grant.
    quiz:
      question: "Credit Limit and Sensitive Identifier now show 'Not authorized' for Marvin. What actually causes that?"
      options:
        - key: excluded_select
          label: "Those columns were excluded from the data grant's SELECT list."
        - key: app_hides
          label: "The application hides those two columns in its display code."
        - key: columns_gone
          label: "Those columns don't exist in the CUSTOMERS table anymore."
        - key: password_scope
          label: "Marvin's password doesn't have permission for those columns."
      correct_answer: excluded_select
      explanation: "Correct. The data grant controls SELECT down to the column level. A column left out of the grant isn't hidden by the app, Oracle never returns it at all."
    notes:
      - "Check the Customer Sales App now, you should see a change in how many rows Marvin sees. Select a Not authorized value to see which Deep Sec data grant and role excluded that column. You can go back to Customize Data Grant and adjust it again to confirm it is working, or to fix a mistake if you are still seeing Credit Limit or Sensitive Identifier. Once you are satisfied, answer the check your understanding question."

  - id: review_grant
    badge: "3"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_grant
    next_hint: Continue to End User Context to prepare Marvin's manager promotion.
    quiz:
      question: After row restriction and column exclusions are applied, what stops Marvin from seeing unauthorized data?
      options:
        - key: database
          label: Oracle's Deep Data Security data grant enforcement.
        - key: application
          label: The Customer Sales App page logic.
        - key: browser
          label: The browser hiding rows and columns.
        - key: password
          label: A different password for the restricted user.
      correct_answer: database
      explanation: Correct. The database enforces the data grant, so changing or bypassing the application cannot reveal rows or columns that Oracle did not authorize.
    notes:
      - "Let us see what you built in the database. You should see two data roles, and five columns where EMPLOYEE_ACCESS is granted SELECT. You will also see the new predicate matching sales_rep to the user's identity, ora_end_user_context.username, and which of the eight CUSTOMERS columns each end user can SELECT, UPDATE, or DELETE."
      - "You will also see the data roles, database roles, and end user information from the last section. One section will still be empty, end user context definitions, you will fill that in next."

  - id: create_managers
    badge: "1"
    label: Manager Lookup
    title: Manager Lookup
    action_ids:
      - create_managers
    next_hint: Run Manager context to build the session-scoped context that reads this lookup.
    notes:
      - "Now you will create a small lookup table identifying who manages which sales rep. In this lab's data set, you are only working with Marvin and Emma, Marvin manages Emma. You also create Priya, but she is not used in this lab."

  - id: create_manager_context
    badge: "2"
    label: Manager context
    title: Manager context
    action_ids:
      - create_manager_context
    next_hint: Run Set Context to wire up the bridge role and context access.
    notes:
      - "This is another genuinely powerful Deep Sec feature, the ability to create and set an end user context. It looks like a table, but UPDATE END_USER_CONTEXT actually updates context stored in the user's session memory, for the life of that session, until it is overwritten or destroyed. That lets Deep Sec quickly resolve any context set for that end user."
      - "Remember, the end user does not have to exist in the database at all, it can live entirely in an enterprise directory. This context is set in memory for their session, letting you build relationships like who their manager is, where they are located, or what application roles they hold."
      - "Traditionally, you would build this with a logon trigger or similar. Deep Sec does it automatically, setting it for the end user on your behalf."

  - id: set_context
    badge: "3"
    label: Set Context
    title: Set Context
    action_ids:
      - set_context
    next_hint: Run Manager Data Grant to define what a manager can see, before granting the role itself.
    notes:
      - "Now you will give APPLAB, and the end users themselves, the ability to read and set the context. This grant is what makes the context actually usable, without it, the context exists but nothing can resolve it during a session."
      - "Notice end users cannot set their own context manually. APPLAB and Deep Sec set it for them automatically, that is a deliberate boundary, not an oversight, it keeps context resolution out of the hands of whoever is signed in."

  - id: customize_manager_grant
    badge: "4"
    label: Manager Data Grant
    title: Manager Data Grant
    action_ids:
      - customize_manager_grant
    next_hint: Run Grant Manager Role to promote Marvin now that his grant is defined.
    notes:
      - "Now that you have created the relationship between employees and managers, decide which columns the manager data role can SELECT or UPDATE, and whether it can DELETE rows."
      - "For this data grant, managers should <u>not</u> be able to SELECT sensitive_identifier."
      - "Managers <u>should</u> be able to UPDATE customer_name, region, and sales_rep."
      - "Managers should <u>not</u> be allowed to delete rows."
      - "Watch the Generated SQL update as you toggle columns to include or exclude, or check and uncheck allow deleting rows."

  - id: grant_manager_role
    badge: "5"
    label: Grant Manager Role
    title: Grant Manager Role
    action_ids:
      - enable_manager
      - disable_manager
    next_hint: Open the Customer Sales App as Marvin to see manager access apply.
    notes:
      - "Now give Marvin this new role, make him a manager. Switch to the Customer Sales App and re-run Customer Report, what changed? Answer the check your understanding question, how many rows do you see now, and are any columns still hidden? See if you can guess why."
      - "One hint before you compare numbers: multiple applicable data grants combine as a union of their rows, not added together. If a row would already be authorized by more than one grant, it still only counts once, keep that in mind as you look at the new total."
      - "Expected result: 3 employee rows + 6 team rows = 9, as a union, not a sum."
    quiz:
      question: Now that Marvin is both an employee and a manager, how many rows are returned?
      options:
        - key: nine
          label: "9"
        - key: twenty_two
          label: "22"
        - key: three
          label: "3"
        - key: zero
          label: "0"
      correct_answer: nine
      explanation: "Correct. His employee grant authorizes his own 3 rows, and his manager grant separately authorizes his own row plus his team's 6 rows. Because the grants are combined as a union, Marvin's row is counted only once, for 9 rows total."

  - id: review_context
    badge: "6"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_context
    next_hint: Continue to Iceberg to extend the existing customer authorization to Iceberg-backed data.
    quiz:
      question: What does the manager data grant use to determine which customer rows a manager can access?
      options:
        - key: context
          label: The authenticated user's end-user context and the manager lookup relationship.
        - key: browser
          label: The manager selected in the Customer Sales App page.
        - key: all_rows
          label: Every row in APPLAB.CUSTOMERS, because managers always have full access.
        - key: table_copy
          label: A private copy of the customer table for each manager.
      correct_answer: context
      explanation: Correct. The data grant reads the authenticated user's context and the manager lookup to decide which rows Oracle returns.
    notes:
      - "This screen confirms the database steps so far. You will see the two data roles, the two data grants, and which columns each has SELECT or UPDATE privileges on."
      - "You will also see the manager grant's new predicate, using the context you just created, ora_end_user_context.APPLAB.MGR_CTX.id, to resolve the manager's ID, and which columns each grant can SELECT or DELETE."
      - "Scroll to the bottom of the script output and you will see a valid row in the end user context definitions view. Check your understanding, then move to the next section."

  - id: explain_iceberg_architecture
    badge: "1"
    label: How it works
    title: How it works
    action_ids:
      - explain_iceberg_architecture
    next_hint: Continue to See the raw data to look at the actual files this diagram describes.
    notes:
      - "If you have made it this far, congratulations, you have already learned the core power of Deep Data Security. Now you will build on that further, protecting data that does not even live inside Oracle Database, an Apache Iceberg data set sitting in an OCI Object Storage bucket."
      - "In this step, you will see that Deep Sec is not just for traditional data, it works with your modern data stack too. You will protect Apache Iceberg data with the same Deep Sec controls you already used on a traditional relational table."

  - id: show_iceberg_files
    badge: "2"
    label: See the raw data
    title: See the raw data
    action_ids:
      - show_iceberg_files
    next_hint: Continue to Create table to see Oracle turn these files into a queryable object.
    notes:
      - "This is the actual proof that Iceberg data is not 'in' Oracle. The deployment publishes these pre-created files to Object Storage, Oracle never copies them into the database, it reads them exactly where they already live."

  - id: create_order_history
    badge: "3"
    label: Create table
    title: Create table
    action_ids:
      - create_order_history
    next_hint: Continue to See the data to query it with ordinary SQL.
    notes:
      - "The published Iceberg metadata graph stays in Object Storage. One statement points Oracle at it and turns it into a queryable object, no ETL, no copy into Oracle."
      - "Now you will give APPLAB the necessary Data Pump and network ACL privileges, then create the external table. In the creation statement, you will see it uses a credential built for this lab, granting APPLAB access to the bucket and the files listed in file_uri_list."

  - id: show_order_history_data
    badge: "4"
    label: See the data
    title: See the data
    action_ids:
      - show_order_history_data
    next_hint: Continue to Extend customer access to authorize what you just saw.
    notes:
      - "The first test is querying it as the ADB's ADMIN user. ADMIN is a very powerful account, used here only to demonstrate that the external table's data is reachable through a standard SQL query."
      - "You should see 1,500 rows, the 5 most recent orders, and a count of orders per sales rep, 395 for Emma, 223 for Marvin. What do those two numbers add up to? Keep that in mind as you continue."

  - id: extend_manager_context
    badge: "5"
    label: Extend customer access
    title: Extend customer access
    action_ids:
      - extend_manager_context
    next_hint: Continue to Review to confirm the grant.
    notes:
      - "If you thought Deep Sec was already cool, wait until you see this. Now you will create a data grant based on the access a sales rep already has to the CUSTOMERS table, building a parent/child relationship between ORDER_HISTORY and CUSTOMERS through Deep Sec data grants. This is what is called a cross-table data grant."
      - "Its predicate does not reference the sales rep's name or the manager context you built earlier at all, it matches customer_id on CUSTOMERS to customer_id on ORDER_HISTORY directly."
      - "That means whatever rows you can see in CUSTOMERS, you can see the matching rows in ORDER_HISTORY, and nothing more. Do you remember how many rows Marvin could see as an employee? How many once he became Emma's manager? That is exactly how this narrows down too."
      - "One more thing worth noticing, Deep Sec data grants support an EXCEPT clause. For this grant, exclude the amount column. Check that box and watch the Generated SQL change to match."
    quiz:
      question: "In the Customer Sales App, scroll down past the Customer Report and run the Iceberg Report. How many rows are returned?"
      options:
        - key: fifteen_hundred
          label: "1500"
        - key: nine_hundred_forty_five
          label: "945"
        - key: six_hundred_eighteen
          label: "618"
        - key: zero
          label: "0"
      correct_answer: six_hundred_eighteen
      explanation: "Correct. Marvin can see 618 Apache Iceberg records through his sales-rep data grant and his manager data grant."

  - id: review_order_history
    badge: "6"
    label: Review & Quiz
    title: Review & Quiz
    action_ids:
      - review_order_history
    next_hint: Continue to Exercises.
    notes:
      - "Run the SQL script to see the new data grants and data roles added to the database. You have now seen how external tables can be queried with plain SQL and still fully protected by Deep Sec. Try the check your understanding question, then move on."
    quiz:
      question: When Oracle creates APPLAB.ORDER_HISTORY, what happens to the Iceberg data?
      options:
        - key: object_storage
          label: It remains in Object Storage; Oracle queries the existing Iceberg files without copying them into database storage.
        - key: database_copy
          label: Oracle copies every Parquet file into an APPLAB table.
        - key: conversion
          label: Oracle converts the Iceberg files into an Oracle-only format.
        - key: deletion
          label: Oracle deletes the Iceberg files after importing their rows.
      correct_answer: object_storage
      explanation: Correct. ORDER_HISTORY is an external table over the existing Iceberg files; the data remains in Object Storage.

  - id: exercise_persona_compare
    badge: "1"
    label: Compare personas
    title: Compare Emma and Marvin
    notes:
      - "Feel free to navigate back through the lab at any point, DB Setup, Deep Sec Setup, wherever you need, to jog your memory before answering."
      - "Pay close attention to what is actually different between Emma and Marvin, and what is identical. The answer is not about their roles."
    action_ids:
      - exercise_persona_compare
    next_hint: Continue to Ask AI Insights.
    quiz:
      question: Emma and Marvin both hold the employee data role. Why don't they see the same rows?
      options:
        - key: different_role
          label: They're actually on different data roles.
        - key: predicate
          label: The grant's row predicate matches each one's own sales_rep value.
        - key: app_logic
          label: The application filters differently per user.
        - key: random
          label: Row order is randomized per session.
      correct_answer: predicate
      explanation: Correct. Same role, same grant, the predicate resolves against whoever's actually signed in, so each person's own rows are what comes back.

  - id: exercise_ai_insights
    badge: "2"
    label: Ask AI Insights
    title: Ask AI Insights
    notes:
      - "Feel free to navigate back through the lab at any point to jog your memory before answering."
      - "Before you ask AI Insights anything, think about where its answer could actually come from. Is it running something new, or working from what is already on your screen?"
    action_ids:
      - exercise_ai_insights
    next_hint: Continue to Order history before and after.
    quiz:
      question: You asked AI Insights a broad question. Did its answer include anyone outside what Customer Report already showed you?
      options:
        - key: yes_more
          label: "Yes, the AI can see more than the table."
        - key: no_same
          label: "No, it's built from the exact same rows and columns Oracle already returned to Customer Report, nothing more."
        - key: depends_prompt
          label: It depends entirely on how the question is phrased.
      correct_answer: no_same
      explanation: "Correct. AI Insights doesn't run its own separate, unrestricted query. It reads from the same result set Oracle already filtered for this session, so whatever the data grant excluded from Customer Report is excluded from what the AI sees too."

  - id: exercise_order_history_before_after
    badge: "3"
    label: Order history before/after
    title: Order history, before and after
    notes:
      - "Feel free to navigate back through the lab at any point, Iceberg especially, to jog your memory before answering."
      - "Look closely at what you actually get before the grant exists, not just whether a row count is low. What Oracle tells you matters."
    action_ids:
      - exercise_order_history_before_after
    next_hint: Continue to Promote Marvin, then compare.
    quiz:
      question: Before the data grant connecting order history back to CUSTOMERS existed, what did Marvin see when he checked order history?
      options:
        - key: nothing
          label: Nothing, not authorized.
        - key: everything
          label: Every order, unrestricted.
        - key: three_rows
          label: Only his own three customers' orders.
      correct_answer: nothing
      explanation: Correct. The external table existed, but nothing authorized any rows on it until that grant connected it back to CUSTOMERS.

  - id: exercise_manager_promotion
    badge: "4"
    label: Compare before/after promotion
    title: Promote Marvin, then compare
    notes:
      - "Feel free to navigate back through the lab at any point, especially Review & Quiz on End User Context, to jog your memory before answering."
      - "Do the math yourself first. Add Marvin's employee rows to his manager rows, then compare that number to what you actually see."
    action_ids:
      - exercise_manager_promotion
    next_hint: Continue to Try a restore.
    quiz:
      question: After promotion, is Marvin's new row count simply his employee rows plus his manager rows added together?
      options:
        - key: yes_sum
          label: "Yes, exactly the sum of both."
        - key: no_union
          label: "No, the two grants union together, so any row both would authorize only counts once."
        - key: manager_only
          label: Only the manager grant's rows count now.
      correct_answer: no_union
      explanation: Correct. Multiple applicable grants combine as a union, not an additive sum, overlapping rows aren't counted twice.

  - id: exercise_reset
    badge: "5"
    label: Try a restore
    title: Use a restore option
    notes:
      - "Feel free to navigate back through the lab at any point to jog your memory before answering."
      - "Think about what a restore would have to do differently if this lab only tracked state in the app, versus real objects living in the database."
    action_ids:
      - exercise_reset
    next_hint: You've now seen this from every angle, the builder side and the user side.
    quiz:
      question: "A restore genuinely drops and recreates database objects, it isn't just an app-level reset. Why does that distinction matter?"
      options:
        - key: real_objects
          label: "Data roles, data grants, and end users are real Oracle objects. Restoring rebuilds them, it doesn't just reset a display."
        - key: no_difference
          label: "It doesn't matter, restores and app resets behave identically either way."
        - key: query_cache
          label: "Oracle caches old query results that a restore has to clear separately."
        - key: server_restart
          label: "The application server needs to be manually restarted after every restore."
      correct_answer: real_objects
      explanation: "Correct. Everything in this lab, roles, grants, end users, context, is a real object living in the database. A restore is SQL running again, not a UI trick, so the application faithfully reflects wherever you rolled back to."

  - id: best_practice_authorization_model
    badge: "1"
    label: Authorization Mode
    title: Authorization Mode
    action_ids:
      - best_practice_authorization_model
    next_hint: Continue to End User Context.
    notes:
      - "You saw this model become concrete when the employee role, row predicate, and column choices changed Marvin's Customer Sales App result without changing the application query."
      - "Start with a decision table: who is the subject, what object is protected, which operation is allowed, which rows and columns are in scope, and what trusted attributes affect the decision."

  - id: best_practice_trusted_identity
    badge: "2"
    label: End User Context
    title: End User Context
    action_ids:
      - best_practice_trusted_identity
    next_hint: Continue to Application Connections.
    notes:
      - "You saw this when Marvin's end user context changed his manager result while the Customer Sales App stayed unchanged."
      - "Application identity and end-user identity are related but distinct. The application identity identifies the calling application; Marvin's end-user security context identifies the person whose request Oracle must authorize."
      - "The lab uses local Marvin and Emma accounts to make the result visible. In production, map enterprise IAM users and roles, then propagate the trusted end-user security context through the connection pool."

  - id: best_practice_minimal_connections
    badge: "3"
    label: Application Connections
    title: Application Connections
    action_ids:
      - best_practice_minimal_connections
    next_hint: Continue to Least Privilege.
    notes:
      - "You saw the safe boundary when the Customer Sales App issued the same query for Marvin and Oracle returned only his authorized result."
      - "A connection pool is an efficiency mechanism, not an authorization model. Do not make the pooled account a back door to every application table."
      - "For requests on behalf of a user, let the application establish trusted identity and context, while Deep Sec data roles and grants decide which data the user can read or change."

  - id: best_practice_least_privilege
    badge: "4"
    label: Least Privilege
    title: Least Privilege
    action_ids:
      - best_practice_least_privilege
    next_hint: Continue to Privilege Elevation.
    notes:
      - "You saw least privilege when Marvin's result changed from 22 rows with all columns to 3 rows with 6 columns, even though the app still sent the same query."
      - "Treat SELECT, UPDATE, INSERT, and DELETE as separate business decisions. An employee may be able to read a row without being able to update every column in it."
      - "Multiple applicable data grants combine as a union. Review the combined result, not each grant in isolation, especially when users hold more than one data role."

  - id: best_practice_trusted_context
    badge: "5"
    label: Privilege Elevation
    title: Privilege Elevation
    action_ids:
      - best_practice_trusted_context
    next_hint: Continue to Audit Policies.
    notes:
      - "You saw controlled elevation when Marvin's MGR_CTX context and manager role expanded his result to the union of his employee and team rows."
      - "Never treat an arbitrary browser field as a trusted authorization attribute. Validate identity and business attributes before placing them in the protected end-user context."
      - "The lab's MGR_CTX demonstrates context-driven manager access. At enterprise scale, sensitive elevation should be approved, scoped to the operation, time-limited, and auditable."

  - id: best_practice_policy_lifecycle
    badge: "6"
    label: Audit Policies
    title: Audit Policies
    action_ids:
      - best_practice_policy_lifecycle
    next_hint: Continue to Summary when you are ready.
    notes:
      - "You saw why lifecycle testing matters when the same Customer Sales App and OCI Generative AI questions produced different authorized results after each policy change."
      - "Test both sides of every policy: authorized and unauthorized users, multiple roles, role changes, pooled connections, direct access paths, and agent-assisted workflows."
      - "Audit Deep Sec administration and runtime use separately. Capture data role creation, assignment, and removal, plus data grant creation, replacement, and removal with Oracle Unified Auditing."
      - "There is no separate data-role-used event. Audit SELECT, INSERT, UPDATE, and DELETE on protected objects, then correlate END_USER_NAME and END_USER_SECURITY_CONTEXT_ID with DBA_DATA_ROLE_GRANTS and DBA_DATA_GRANTS."

  - id: what_you_proved
    badge: "1"
    label: Summary
    title: Summary
    action_ids:
      - what_you_proved
    next_hint: Use Admin to validate or reset the lab when you are ready.
    notes:
      - "The query did not become more trusted because it came from an application or an AI prompt. The result changed because Oracle evaluated the signed-in end user, active data roles, data grants, and end user context."
      - "The four result sets are the evidence to take home: broad baseline access, least-privilege employee access, the manager union, and cross-table Iceberg access."

  - id: validate_as_marvin
    badge: V
    label: Run validation
    title: Run validation
    action_ids:
      - validate_as_marvin
    next_hint: Use Reset all if you want to start the whole lab over from scratch.
    notes:
      - "This page reads Emma's and Marvin's authorization straight from Oracle and shows them side by side, active data roles, applicable data grants, and the plain-English row rule each one resolves to."
      - "Emma is a good reference point precisely because her access never changes, she is always on the employee role only. Comparing her card against Marvin's is a fast way to see exactly what his manager promotion actually added."

  - id: restore_db_setup
    badge: DB
    label: Restore to DB Setup
    title: Restore to DB Setup
    notes:
      - "This drops everything Deep Sec-specific and rebuilds fresh, right back to where DB Setup left off, ordinary schema, sample data, connect role, nothing more. Use it if you have been experimenting with data roles and grants and want a clean slate to redo Deep Sec Setup onward, without touching the basics."
      - "Remember, this is real SQL running again, not a display reset. Every object it mentions is genuinely dropped and recreated."
    action_ids:
      - restore_db_setup
    next_hint: Use Restore to Deep Sec Setup to add the baseline data roles, data grant, Marvin, and Emma.

  - id: restore_deep_sec_setup
    badge: DS
    label: Restore to Deep Sec Setup
    title: Restore to Deep Sec Setup
    notes:
      - "This goes one step further than Restore to DB Setup, it rebuilds the schema and also recreates the baseline employee data role, its wide-open grant, and both Marvin and Emma. Use it if you want to redo Customize Grant, End User Context, or Iceberg from a known-good starting point, without repeating Deep Sec Setup itself."
      - "Whatever you customized past this point, excluded columns, the manager grant, order history access, is gone after this runs. That is the point, it is a genuine do-over, not a partial one."
    action_ids:
      - restore_deep_sec_setup
    next_hint: Open the Customer Sales App to continue from the baseline employee access.

  - id: download_lab_files
    badge: D
    label: Downloads
    title: Downloads
    notes:
      - "These ZIPs are built fresh every time you click, straight from what is actually running on this VM right now, not a snapshot from whenever the lab was first deployed. If you have customized anything, that is what you will get."
      - "This is worth doing if you want to bring Deep Sec into your own environment. The SQL here is not lab-specific magic, it is exactly what you would run against your own Oracle Database."
    action_ids:
      - download_lab_files

  - id: reset_lab
    badge: R
    label: Reset all
    title: Reset all
    notes:
      - "This is the most complete reset available, APPLAB, Marvin, Emma, and every Deep Sec role this lab created, all dropped. Nothing about DB Setup survives, you are rebuilding from Prepare App forward."
      - "Use this when you want to start completely over, not just redo one section. For a smaller do-over, Restore to DB Setup or Restore to Deep Sec Setup gets you back to a working state faster."
    action_ids:
      - reset_lab
    next_hint: Use the secure employee baseline reset once it is available, or run Prepare APPLAB to begin again.

