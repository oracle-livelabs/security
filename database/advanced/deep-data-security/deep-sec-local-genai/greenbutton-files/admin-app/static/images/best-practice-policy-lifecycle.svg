<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="title desc">
  <title id="title">Test, audit, and manage policies as code</title>
  <desc id="desc">Deep Data Security policy definitions move from version control through CI/CD and testing into runtime enforcement, dictionary inspection, and audit evidence.</desc>
  <rect width="960" height="300" rx="14" fill="#f7f6f4"/>
  <text x="32" y="38" fill="#312d2a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Treat authorization as a lifecycle</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="24" y="82" width="154" height="112" rx="12" fill="#fff2ef" stroke="#c74634" stroke-width="3"/>
    <text x="47" y="114" fill="#312d2a" font-size="18" font-weight="700">Policy repo</text>
    <text x="47" y="142" fill="#625f5b" font-size="14">data grants</text>
    <text x="47" y="165" fill="#625f5b" font-size="14">contexts + roles</text>
    <text x="47" y="188" fill="#625f5b" font-size="14">versioned</text>

    <line x1="190" y1="138" x2="207" y2="138" stroke="#c74634" stroke-width="3"/>
    <polygon points="207,138 195,130 195,146" fill="#c74634"/>
    <rect x="219" y="82" width="154" height="112" rx="12" fill="#fff8e1" stroke="#926014" stroke-width="3"/>
    <text x="242" y="114" fill="#312d2a" font-size="18" font-weight="700">CI/CD</text>
    <text x="242" y="142" fill="#625f5b" font-size="14">review</text>
    <text x="242" y="165" fill="#625f5b" font-size="14">deploy</text>
    <text x="242" y="188" fill="#625f5b" font-size="14">rollback</text>

    <line x1="385" y1="138" x2="402" y2="138" stroke="#926014" stroke-width="3"/>
    <polygon points="402,138 390,130 390,146" fill="#926014"/>
    <rect x="414" y="82" width="154" height="112" rx="12" fill="#eff6ff" stroke="#005fb8" stroke-width="3"/>
    <text x="437" y="114" fill="#312d2a" font-size="18" font-weight="700">Test matrix</text>
    <text x="437" y="142" fill="#625f5b" font-size="14">allow / deny</text>
    <text x="437" y="165" fill="#625f5b" font-size="14">roles + paths</text>
    <text x="437" y="188" fill="#625f5b" font-size="14">pooled sessions</text>

    <line x1="580" y1="138" x2="597" y2="138" stroke="#005fb8" stroke-width="3"/>
    <polygon points="597,138 585,130 585,146" fill="#005fb8"/>
    <rect x="609" y="82" width="154" height="112" rx="12" fill="#eff6ff" stroke="#005fb8" stroke-width="3"/>
    <text x="632" y="114" fill="#312d2a" font-size="18" font-weight="700">Runtime</text>
    <text x="632" y="142" fill="#625f5b" font-size="14">Oracle enforces</text>
    <text x="632" y="165" fill="#625f5b" font-size="14">rows + columns</text>
    <text x="632" y="188" fill="#625f5b" font-size="14">every path</text>

    <line x1="775" y1="138" x2="792" y2="138" stroke="#005fb8" stroke-width="3"/>
    <polygon points="792,138 780,130 780,146" fill="#005fb8"/>
    <rect x="804" y="82" width="132" height="112" rx="12" fill="#f2f7f4" stroke="#277447" stroke-width="3"/>
    <text x="827" y="114" fill="#312d2a" font-size="18" font-weight="700">Evidence</text>
    <text x="827" y="142" fill="#625f5b" font-size="14">DBA_ views</text>
    <text x="827" y="165" fill="#625f5b" font-size="14">audit trail</text>
    <text x="827" y="188" fill="#625f5b" font-size="14">attribution</text>

    <rect x="24" y="232" width="912" height="42" rx="9" fill="#fff8e1" stroke="#e8d888" stroke-width="2"/>
    <text x="48" y="259" fill="#514d48" font-size="16" font-weight="700">Define → test → deploy → observe → improve</text>
  </g>
</svg>
